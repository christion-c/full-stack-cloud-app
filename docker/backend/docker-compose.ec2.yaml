version: "3.9"
services:
  api:
    image: ghcr.io/OWNER/REPO/backend:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - /opt/app/.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
